<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5cad">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>환율·정산</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1a1a1a; --sub:#5b6470; --border:#e3e6ea;
  --accent:#0f5cad; --accent-text:#ffffff; --up:#c0392b; --down:#1a6fd4;
  --chip:#eef1f5; --chip-on:#0f5cad; --key:#ffffff; --key-press:#e6ebf2; --warn:#b7791f; --ok:#2e7d32;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --card:#1e2025; --text:#eaeaea; --sub:#9a9aa2; --border:#33343a;
    --accent:#4d8fe0; --accent-text:#0b1220; --up:#ff6b60; --down:#5b9bff;
    --chip:#26272c; --chip-on:#4d8fe0; --key:#23252b; --key-press:#2f323a; --warn:#e0a63a; --ok:#6cc070;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --card:#1e2025; --text:#eaeaea; --sub:#9a9aa2; --border:#33343a;
  --accent:#4d8fe0; --accent-text:#0b1220; --up:#ff6b60; --down:#5b9bff;
  --chip:#26272c; --chip-on:#4d8fe0; --key:#23252b; --key-press:#2f323a; --warn:#e0a63a; --ok:#6cc070;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{margin:0;height:100%;}
body{margin:0;min-height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.45;font-size:16px;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
input,select{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.top h1{font-size:1.15rem;margin:0;}
.badge{font-size:.78rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;}
section.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow);}
h2{font-size:.95rem;margin:0 0 8px;color:var(--sub);font-weight:600;}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;background:var(--chip);border-radius:999px;padding:8px 14px;font-size:.92rem;min-height:40px;border:1px solid transparent;}
.chip.on{background:var(--chip-on);color:var(--accent-text);font-weight:600;}
.chip.more{border:1px dashed var(--border);background:transparent;color:var(--sub);}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin:6px 0 10px;}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-size:.92rem;color:var(--sub);min-height:42px;}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:var(--shadow);}
.amount{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;padding:8px 4px 4px;min-height:64px;}
.amount .num{font-size:2.4rem;font-weight:700;letter-spacing:-.02em;word-break:break-all;text-align:right;}
.amount .unit{font-size:1rem;color:var(--sub);}
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;}
.res{background:var(--chip);border-radius:12px;padding:12px 14px;}
.res .lbl{font-size:.8rem;color:var(--sub);}
.res .v{font-size:1.45rem;font-weight:700;margin-top:2px;word-break:break-all;}
.rateline{font-size:.8rem;color:var(--sub);margin:4px 2px 10px;line-height:1.5;}
.rateline b{color:var(--text);font-weight:600;}
.err{color:var(--up);font-size:.88rem;margin:6px 0;}
.warn{color:var(--warn);}
.ok{color:var(--ok);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.key{background:var(--key);border:1px solid var(--border);border-radius:12px;font-size:1.5rem;min-height:58px;font-weight:600;}
.key:active{background:var(--key-press);}
.key.fn{font-size:1.4rem;color:var(--sub);}
.actions{display:flex;gap:8px;margin-top:12px;}
.btn{flex:1;min-height:50px;border-radius:12px;background:var(--chip);font-weight:600;padding:0 14px;}
.btn.primary{background:var(--accent);color:var(--accent-text);}
.btn.danger{color:var(--up);}
.btn.clear{background:rgba(192,57,43,.12);color:var(--up);border:1.5px solid var(--up);font-weight:700;}
.btn.clear:active{background:rgba(192,57,43,.28);}
.btn.sm{flex:0 0 auto;min-height:38px;font-size:.88rem;padding:0 12px;}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;}
.row > *{min-width:0;}
.row label{flex:0 0 78px;font-size:.88rem;color:var(--sub);}
.payer{display:flex;gap:6px;}
.payer button{flex:1;min-height:44px;border-radius:10px;background:var(--chip);font-weight:600;}
.payer button.on{background:var(--accent);color:var(--accent-text);}
.items{margin-top:6px;}
.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--border);}
.item:first-child{border-top:0;}
.item .who{flex:0 0 auto;font-size:.78rem;background:var(--chip);border-radius:8px;padding:4px 8px;font-weight:600;}
.item .mid{flex:1;min-width:0;}
.item .desc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .sub{font-size:.78rem;color:var(--sub);}
.item .amt{text-align:right;flex:0 0 auto;}
.item .amt b{display:block;}
.item .amt small{color:var(--sub);}
.summary{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 -2px 12px rgba(0,0,0,.08);}
.summary .line{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;padding:2px 0;}
.summary .line.total{border-top:1px solid var(--border);margin-top:4px;padding-top:6px;font-weight:700;}
.summary .xfer{margin-top:6px;font-size:1.05rem;font-weight:700;color:var(--up);}
.summary .xfer small{color:var(--sub);font-weight:500;}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:10;}
.tabs button{flex:1;height:60px;font-size:.85rem;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;}
.tabs button .ic{font-size:1.25rem;line-height:1;}
.tabs button.on{color:var(--accent);font-weight:700;}
.list-plain{margin:0;padding:0;list-style:none;font-size:.85rem;color:var(--sub);}
.list-plain li{padding:3px 0;}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:.9rem;}
.kv:first-of-type{border-top:0;}
.kv .del{color:var(--up);font-size:.85rem;padding:0 6px;}
table.rates{width:100%;border-collapse:collapse;font-size:.85rem;}
table.rates td,table.rates th{padding:5px 4px;text-align:right;border-top:1px solid var(--border);white-space:nowrap;}
table.rates th{color:var(--sub);font-weight:500;border-top:0;}
table.rates td:first-child,table.rates th:first-child{text-align:left;}
.tbl-wrap{overflow-x:auto;}
.muted{color:var(--sub);font-size:.85rem;}
.hint{font-size:.8rem;color:var(--sub);margin:4px 0 0;}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:.9rem;}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub);vertical-align:middle;margin-left:6px;}
/* 환율 탭: 헤더 없이 카드 하나가 화면(탭바 위까지)을 꽉 채움. 스크롤 없이 키패드까지 한 화면 */
body.fx{padding-bottom:0;overflow:hidden;}
body.fx .top{display:none;}
body.fx main{height:calc(100vh - 60px - env(safe-area-inset-bottom));height:calc(100dvh - 60px - env(safe-area-inset-bottom));padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;flex-direction:column;overflow:auto;}
body.fx section.card{flex:1;display:flex;flex-direction:column;min-height:0;margin:0;padding:8px 10px 10px;}
body.fx .chips{padding:2px 0 4px;gap:6px;}
body.fx .chip{min-height:34px;padding:5px 12px;font-size:.88rem;}
body.fx .muted{font-size:.78rem;}
body.fx .amount{min-height:44px;padding:2px 4px 0;}
body.fx .amount .num{font-size:2rem;}
body.fx .results{gap:6px;margin:4px 0;}
body.fx .res{padding:7px 10px;border-radius:10px;}
body.fx .res .lbl{font-size:.72rem;}
body.fx .res .v{font-size:1.15rem;margin-top:0;}
body.fx .results .res:nth-child(odd):last-child{grid-column:1/-1;}
body.fx .rateline{font-size:.74rem;line-height:1.45;margin:2px 2px 6px;}
body.fx .keypad{flex:1;min-height:0;grid-template-rows:repeat(4,minmax(40px,1fr));gap:6px;}
body.fx .key{min-height:0;font-size:1.3rem;}
body.fx .actions{margin-top:8px;}
body.fx .btn{min-height:44px;}
</style>
</head>
<body>
<header class="top"><h1 id="title">환율</h1><div id="rate-badge" class="badge"></div></header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="fx"><span class="ic">💱</span>환율</button>
  <button data-tab="settle"><span class="ic">🧾</span>정산</button>
  <button data-tab="settings"><span class="ic">⚙️</span>설정</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>이 앱은 자바스크립트가 필요함.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
